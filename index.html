const KEY = "terminbuch-pro-clean-v1";
let S = { lang: "tr", a: [], l: [], set: { shop: "", cur: "€", ci: "Personel", pct: 40 } };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch (e) {}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function T(k) { return (I18N[S.lang] && I18N[S.lang][k]) || I18N.tr[k] || k; }
function localeStr() { return S.lang === "de" ? "de-DE" : S.lang === "en" ? "en-US" : "tr-TR"; }

function ymd(d) {
  const m = d.getMonth() + 1, x = d.getDate();
  return d.getFullYear() + "-" + (m < 10 ? "0" : "") + m + "-" + (x < 10 ? "0" : "") + x;
}
function pd(s) { const p = s.split("-"); return new Date(+p[0], +p[1] - 1, +p[2]); }
function shift(s, n) { const d = pd(s); d.setDate(d.getDate() + n); return ymd(d); }
function money(n) { return Math.round(n).toLocaleString(localeStr()) + " " + (S.set.cur || "€"); }
function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }

function cap(s) { return String(s || "").trim().split(/\s+/).map(w => w.charAt(0).toLocaleUpperCase("tr") + w.slice(1).toLocaleLowerCase("tr")).join(" "); }
function dl(s) {
  if (s === today) return T("today");
  if (s === shift(today, 1)) return T("tomorrow");
  if (s === shift(today, -1)) return T("yesterday");
  return pd(s).toLocaleDateString(localeStr(), { day: "numeric", month: "long" });
}

let view = "r", today = ymd(new Date()), day = today, cmo = today.slice(0, 7), cmode = "ay";
let notifiedIds = {};

function calc(d) {
  let c = 0, v = 0, g = 0;
  S.a.forEach(a => { if (a.d === d && a.st === "done") { if (a.pay === "veresiye") v += +a.p; else c += +a.p; } });
  S.l.forEach(e => { if (e.d === d) { if (e.k === "gelir" || e.k === "tahsilat") c += +e.p; else if (e.k === "veresiye") v += +e.p; else g += +e.p; } });
  return { c, v, g };
}
function debts() {
  const m = {};
  S.a.forEach(a => { if (a.st === "done" && a.pay === "veresiye") m[a.n] = (m[a.n] || 0) + +a.p; });
  S.l.forEach(e => { if (e.k === "veresiye") m[e.n] = (m[e.n] || 0) + +e.p; if (e.k === "tahsilat") m[e.n] = (m[e.n] || 0) - +e.p; });
  Object.keys(m).forEach(k => { if (m[k] <= 0) delete m[k]; }); return m;
}

  document.querySelectorAll("[data-t]").forEach(el => el.textContent = T(el.dataset.t));

function checkUpcomingBanner() {
  const now = new Date(), curMin = now.getHours() * 60 + now.getMinutes();
  const todayApps = S.a.filter(a => a.d === today && a.st === "wait");
  for (let a of todayApps) {
    const [hh, mm] = a.t.split(":").map(Number);
    const diff = (hh * 60 + mm) - curMin;
    if (diff >= 0 && diff <= 30) {
      if (diff <= 15 && !notifiedIds[a.id]) { notifiedIds[a.id] = true; playDing(); }
      return `<div class="alert-banner"><div><b>⏰ ${T("soonAlert")} ${esc(a.n)} (${a.t})</b><br><small>${esc(a.sv)} · ${diff} ${T("minLeft")}</small></div><button class="sec-btn" onclick="addCalAlarm('${a.id}')">🔔 Alarm</button></div>`;
    }
  }
  return "";
}
function dueReminders() {
  const now = Date.now(), out = [];
  S.a.forEach(a => {
    if (!a.ar || a.sent || a.st !== "wait") return;
    const p = a.d.split("-").map(Number), q = a.t.split(":").map(Number);
    const at = new Date(p[0], p[1] - 1, p[2], q[0], q[1]).getTime();
    if (now >= at - (+a.rm || 60) * 60000 && now < at) out.push(a);
  });
  return out;
}
function dueRemindersBanner() {
  let h = "";
  dueReminders().forEach(a => {
    const k = "rem" + a.id;
    if (!notifiedIds[k]) { notifiedIds[k] = true; playDing(); }
    h += `<div class="alert-banner"><div><b>${T("remDue")} ${esc(a.n)} (${a.t})</b><br><small>${esc(a.sv)}</small></div><button class="pri-btn" onclick="sendWhatsApp('${a.id}')">💬 ${T("remSend")}</button></div>`;
  });

}
function playDing() {

    const ctx = new (window.AudioContext || window.webkitAudioContext)();

  for (let i = -2; i <= 3; i++) {
    const d = shift(day, i), n = S.a.filter(a => a.d === d && a.st !== "cancel").length;

function vT() {
  const y = +cmo.slice(0, 4), mo = +cmo.slice(5, 7) - 1, first = new Date(y, mo, 1);
  const ml = first.toLocaleDateString(localeStr(), { month: "long", year: "numeric" });
  const M = S.a.filter(a => a.d.slice(0, 7) === cmo && a.st !== "cancel");
  let h = `<div class="seg"><button class="${cmode === 'ay' ? 'on' : ''}" onclick="cmode='ay';render()">${T("month")}</button><button class="${cmode === 'liste' ? 'on' : ''}" onclick="cmode='liste';render()">${T("list")}</button><button class="${cmode === 'hepsi' ? 'on' : ''}" onclick="cmode='hepsi';render()">${T("upcoming")}</button></div>`;
  if (cmode !== "hepsi") h += `<div class="mh"><button onclick="shiftMonth(-1)">‹</button><div style="text-align:center"><b>${ml}</b><br><small>${M.length}</small></div><button onclick="shiftMonth(1)">›</button></div>`;
  if (cmode === "ay") {
    const days = S.lang === "de" ? ["Mo","Di","Mi","Do","Fr","Sa","So"] : S.lang === "en" ? ["Mo","Tu","We","Th","Fr","Sa","Su"] : ["Pzt","Sal","Çar","Per","Cum","Cmt","Paz"];
    h += `<div class="cal">` + days.map(x => `<div class="dw">${x}</div>`).join("");
    const off = (first.getDay() + 6) % 7, start = shift(ymd(first), -off);
    for (let i = 0; i < 42; i++) {
      const d = shift(start, i), dd = pd(d);
      if (i >= 35 && dd.getMonth() !== mo) break;
      const n = S.a.filter(a => a.d === d && a.st !== "cancel").length;
      h += `<div class="cd ${dd.getMonth() !== mo ? 'x' : ''} ${d === today ? 'td' : ''} ${d === day ? 'on' : ''}" onclick="day='${d}';render()">${dd.getDate()}${n ? `<span>${n}</span>` : ""}</div>`;
    }
    h += `</div>`;
    const L = S.a.filter(a => a.d === day).sort((a,b) => a.t < b.t ? -1 : 1);
    h += `<div class="hd"><b>${dl(day)}</b><button class="pri-btn" onclick="openAppModal()">${T("addApp")}</button></div>`;
    if (!L.length) h += `<div class="empty">${T("noApp")}</div>`;
    L.forEach(a => h += arow(a));
    return h;
  }
  const A = (cmode === "liste" ? S.a.filter(a => a.d.slice(0, 7) === cmo) : S.a.filter(a => a.d >= today && a.st !== "cancel")).sort((a, b) => a.d === b.d ? (a.t < b.t ? -1 : 1) : (a.d < b.d ? -1 : 1));
  if (!A.length) return h + `<div class="empty">${T("noApp")}</div>`;
  A.forEach(a => h += arow(a));
  return h;
}

function normalizePhone(raw) {
  let plus = /^\s*(\+|00)/.test(raw), d = raw.replace(/\D/g, "");
  if (/^00/.test(d)) { d = d.slice(2); plus = true; }
  if (plus) return "+" + d;
  if (/^(49|90)\d{9,11}$/.test(d)) return "+" + d;
  if (/^05\d{9}$/.test(d)) return "+90" + d.slice(1);
  if (/^5\d{9}$/.test(d)) return "+90" + d;
  if (/^01[5-7]\d{7,9}$/.test(d)) return "+49" + d.slice(1);
  return d;
}

function parseVoiceCommand() {
  let raw = (document.getElementById("voiceText").value || "").trim();
  if (!raw) return;

  // 0. TELEFON: ilk önce çıkarılır, sayılar karışmasın
  let phone = "";
  const phM = raw.match(/(?:\+|00|0)\d(?:[\s\-().]?\d){8,}/) || raw.match(/\d(?:[\s\-().]?\d){9,}/);
  if (phM) { phone = normalizePhone(phM[0]); raw = raw.replace(phM[0], " "); }
  const low = raw.toLocaleLowerCase("tr-TR");

  // Gider kontrolü
  if (/(fatura|kira|elektrik|su|gider|malzeme|miete|strom)/.test(low) && !/(randevu|termin|oluştur|yaz|ekle|saç|sakal|kesim)/.test(low)) {
    const numMatch = low.match(/(\d+)/); const amt = numMatch ? +numMatch[1] : 0;
    const cleanDesc = raw.replace(/\d+/g, "").replace(/(tl|lira|euro|€|\$)/gi, "").trim();
    if (amt > 0) { S.l.push({ id: uid(), d: today, k: "gider", n: cap(cleanDesc || "Gider"), p: amt }); save(); closeModal(); go("k"); return; }
  }

  // 1. TARİH
  let targetDate = day;
  if (/(yarın|yarin|morgen|tomorrow)/.test(low)) targetDate = shift(today, 1);
  else if (/(bugün|bugun|heute|today)/.test(low)) targetDate = today;
  const dm = low.match(VOICE_DATE_RE);
  if (dm) {
    let yr = new Date().getFullYear();
    targetDate = `${yr}-${VOICE_MONTHS[dm[2].toLocaleLowerCase("tr-TR")]}-${String(dm[1]).padStart(2, "0")}`;
    if (targetDate < today) targetDate = `${yr + 1}-${targetDate.slice(5)}`;
  }

  // 2. SAAT
  let targetTime = "14:00";
  const tMatch = low.match(/(\d{1,2})\s*[:.]\s*(\d{2})/) || low.match(/\b(?:saat|um|at)\s*(\d{1,2})\b/);
  if (tMatch) targetTime = `${String(tMatch[1]).padStart(2, "0")}:${tMatch[2] ? String(tMatch[2]).padStart(2, "0") : "00"}`;

  // 3. ÜCRET
  const pMatch = low.match(/(\d+)\s*(?:euro|€|lira|tl|\$)/i) || low.match(/(?:tutar|fiyat|ücret|toplamda)\s*(\d+)/i);

  // 4. HİZMET
  const svList = I18N[S.lang].services;
  let chosenSv = svList[0][0], chosenP = svList[0][1];
  if (/(saç.*sakal|sakal.*saç|haare.*bart|hair.*beard)/.test(low)) { chosenSv = svList[2][0]; chosenP = svList[2][1]; }
  else if (/(sakal|bart|beard)/.test(low)) { chosenSv = svList[1][0]; chosenP = svList[1][1]; }
  else if (/(çocuk|kinder|kids)/.test(low)) { chosenSv = svList[3][0]; chosenP = svList[3][1]; }
  if (pMatch) chosenP = +pMatch[1];

  // 5. İSİM: Cümlede birden fazla "için/adına" varsa (Örn: "Saat 12:00 için ... Mehmet adına") hepsini tarar ve gerçek ismi bulur
  const words = low
    .replace(VOICE_DATE_RE, " ")
    .replace(/\d{1,2}\s*[:.]\s*\d{2}/g, " ")
    .replace(/\d+\s*(?:euro|€|lira|tl|\$)/g, " ")
    .replace(/['’‘`´]\p{L}*/gu, " ")
    .replace(/[^\p{L}\s]/gu, " ")
    .split(/\s+/).filter(t => t.length > 1);
  let name = "";
  for (let idx = 0; idx < words.length; idx++) {
    if (/^(için|icin|adına|adina|adlı|adli|isimli|für|for)$/.test(words[idx]) && idx > 0) {
      const arr = [];
      for (let i = idx - 1; i >= 0 && arr.length < 3; i--) {
        if (VOICE_STOP.has(words[i])) break;
        arr.unshift(words[i]);
      }
      if (arr.length) { name = arr.join(" "); break; }
    }
  }
  if (!name) name = words.filter(t => !VOICE_STOP.has(t)).slice(0, 2).join(" ");
  name = cap(name);
  if (name.length < 2) name = "Müşteri";

  const deNames = /(hans|peter|michael|thomas|andreas|stefan|markus|christian|martin|alexander|lukas|paul|felix|leon|müller|schmidt|meier)/i;
  const detectedLang = deNames.test(name) ? "de" : S.lang;
  const wantsRem = /(hatırlat|hatirlat|erinner|remind)/.test(low);

  closeModal();
  openAppModal({ n: name, ph: phone, d: targetDate, t: targetTime, sv: chosenSv, p: chosenP, lg: detectedLang, ar: wantsRem });
}

function openSettings() {
  document.getElementById("modalContent").innerHTML = `
    <h3 style="margin:0 0 14px">⚙️ ${T("settings")}</h3>
    <div class="field"><label>${T("shopName")}</label><input id="s_shop" class="inp" value="${esc(S.set.shop)}" placeholder="${T("defaultTitle")}"></div>
    <div class="two" style="margin:0 0 12px">
      <div class="field" style="margin:0"><label>${T("currency")}</label><select id="s_cur" class="inp"><option value="€" ${S.set.cur==='€'?'selected':''}>€</option><option value="₺" ${S.set.cur==='₺'?'selected':''}>₺</option></select></div>
      <div class="field" style="margin:0"><label>${T("staffShare")}</label><input id="s_pct" type="number" class="inp" value="${S.set.pct}"></div>
    </div>
    <div class="field"><label>${T("staffName")}</label><input id="s_ci" class="inp" value="${esc(S.set.ci)}"></div>
    <div style="display:grid;gap:8px;margin-top:14px">
      <button class="pri-btn" onclick="saveSettings()">${T("save")}</button>
      <button class="sec-btn" onclick="downloadBackup()">${T("backup")}</button>
      <button class="sec-btn" onclick="restoreBackup()">${T("restore")}</button>
      <button class="sec-btn" style="color:var(--danger)" onclick="resetDatabase()">${T("resetAll")}</button>
    </div>`;
  document.getElementById("modalBg").classList.add("open");
}

function saveSettings() {
  S.set.shop = document.getElementById("s_shop").value.trim();
  S.set.cur = document.getElementById("s_cur").value;
  S.set.pct = +document.getElementById("s_pct").value || 40;
  S.set.ci = document.getElementById("s_ci").value.trim() || "Personel";
  save(); closeModal(); render();
}

async function downloadBackup() {
  const name = `terminbuch-backup-${ymd(new Date())}.json`, json = JSON.stringify(S, null, 2);
  try {
    const f = new File([json], name, { type: "application/json" });
    if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); return; }
  } catch (e) { if (e && e.name === "AbortError") return; }
  const blob = new Blob([json], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; a.click();
}

function restoreBackup() {
  const inp = document.createElement("input"); inp.type = "file"; inp.accept = ".json,application/json,text/plain";
  inp.onchange = () => {
    const f = inp.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      let d;
      try { d = JSON.parse(r.result); if (!d || !Array.isArray(d.a) || !Array.isArray(d.l)) throw 0; } catch (e) { alert(T("restoreBad")); return; }
      if (!confirm(T("restoreAsk"))) return;
      S = Object.assign({ lang: S.lang, a: [], l: [] }, d);
      S.set = Object.assign({ shop: "", cur: "€", ci: "Personel", pct: 40 }, d.set || {});
      save(); closeModal(); render(); alert(T("restoreOk"));
    };
    r.readAsText(f);
  };
  inp.click();
}

function resetDatabase() {
  if (confirm("Tüm randevular silinsin mi?")) { localStorage.removeItem(KEY); S.a = []; S.l = []; save(); closeModal(); render(); }
}

function closeModal() { document.getElementById("modalBg").classList.remove("open"); }
let remSig = "";
function tick() {
  const nd = ymd(new Date()); if (nd !== today) today = nd;
  const sig = dueReminders().map(a => a.id).join(",");
  if (view === "r" || sig !== remSig) { remSig = sig; render(); }
}
setInterval(tick, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) tick(); });
render();
if ("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("./sw.js").catch(() => {}));
</script>
</body>
